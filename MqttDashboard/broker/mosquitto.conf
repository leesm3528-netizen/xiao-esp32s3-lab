# Local development broker for MqttDashboard (LAN only, no auth).
# Run:  powershell -ExecutionPolicy Bypass -File MqttDashboard\start-broker.ps1
# The Windows "mosquitto" service runs without a config and only listens on
# localhost:1883, so the board cannot reach it. This instance uses other ports.

allow_anonymous true

# MQTT for the XIAO board (and mosquitto_pub/sub)
listener 1884 0.0.0.0
protocol mqtt

# WebSocket for the browser dashboard (web/index.html)
listener 9001
protocol websockets

log_type error
log_type warning
log_type notice
log_type information
connection_messages true
