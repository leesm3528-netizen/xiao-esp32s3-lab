<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XIAO 원격 대시보드</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d1f23; --muted:#6b7280; --on:#f59e0b; --touch:#10b981; --off:#d1d5db; --err:#ef4444; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#e8eaed; --muted:#9aa0a6; --off:#3a3f47; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:480px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; display:flex; align-items:center; gap:6px; }
  .sub .pip { width:8px; height:8px; border-radius:50%; background:var(--off); }
  .sub.ok .pip { background:var(--touch); }
  .sub.err { color:var(--err); }
  .sub.err .pip { background:var(--err); }
  .card { background:var(--card); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .row { display:flex; align-items:center; justify-content:space-between; }
  .label { font-size:15px; font-weight:600; }
  .state { font-size:13px; color:var(--muted); margin-top:4px; }
  .dot { width:56px; height:56px; border-radius:50%; background:var(--off); transition:background .15s, box-shadow .15s; }
  .dot.led { background:var(--on); box-shadow:0 0 24px var(--on); }
  .dot.touch { background:var(--touch); box-shadow:0 0 24px var(--touch); }
  .btns { display:flex; gap:10px; margin-top:16px; }
  button, a.btn { flex:1; padding:12px; font-size:15px; font-weight:600; border:0; border-radius:10px; cursor:pointer; background:var(--off); color:var(--text);
    text-align:center; text-decoration:none; font-family:inherit; }
  button.primary, a.btn.primary { background:var(--on); color:#fff; }
  a.btn[aria-disabled="true"] { background:var(--off); color:var(--muted); pointer-events:none; }
  .meta { font-size:12px; color:var(--muted); margin-top:12px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>XIAO ESP32-S3 원격 대시보드</h1>
  <div class="sub" id="conn"><span class="pip"></span><span id="connText">연결 중…</span></div>

  <div class="card">
    <div class="row">
      <div><div class="label">LED (GPIO21)</div><div class="state" id="ledState">-</div></div>
      <div class="dot" id="ledDot"></div>
    </div>
    <div class="btns">
      <button class="primary" onclick="setLed(true)">켜기</button>
      <button onclick="setLed(false)">끄기</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div><div class="label">터치센서 (D0)</div><div class="state" id="touchState">-</div></div>
      <div class="dot" id="touchDot"></div>
    </div>
    <div class="meta" id="touchMeta">-</div>
  </div>

  <div class="card">
    <div class="label">카메라</div>
    <div class="state">보드와 같은 Wi-Fi에 연결된 기기에서만 볼 수 있습니다.</div>
    <div class="btns">
      <a class="btn primary" id="camLink" href="#" target="_blank" rel="noopener">카메라 보기</a>
    </div>
    <div class="meta" id="camMeta">-</div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://dqwrwqkbvelhqytqyfhi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UrkPkmc3DSlLRZ6H6ryRAw_Sa4ctlhh';
const DEVICE_ID = 'xiao';
const OFFLINE_AFTER_MS = 6000;  // device heartbeat is every 2s

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let state = null;

function render() {
  if (!state) return;
  document.getElementById('ledState').textContent = state.led_on ? '켜짐' : '꺼짐';
  document.getElementById('ledDot').className = 'dot' + (state.led_on ? ' led' : '');
  document.getElementById('touchState').textContent = state.touched ? '터치 중' : '터치 안 함';
  document.getElementById('touchDot').className = 'dot' + (state.touched ? ' touch' : '');
  document.getElementById('touchMeta').textContent = '값 ' + state.touch_value + ' / 기준 ' + state.baseline;
  const cam = document.getElementById('camLink');
  if (state.local_ip) {
    cam.href = 'http://' + state.local_ip + '/';
    cam.removeAttribute('aria-disabled');
    document.getElementById('camMeta').textContent = '주소 http://' + state.local_ip + '/  ·  http://xiao.local/';
  } else {
    cam.setAttribute('aria-disabled', 'true');
    document.getElementById('camMeta').textContent = '보드가 아직 주소를 보고하지 않았습니다';
  }
  renderConn();
}

function renderConn(error) {
  const c = document.getElementById('conn');
  const t = document.getElementById('connText');
  if (error) { c.className = 'sub err'; t.textContent = error; return; }
  if (!state) return;
  const seen = state.device_seen_at ? new Date(state.device_seen_at) : null;
  const online = seen && Date.now() - seen.getTime() < OFFLINE_AFTER_MS;
  c.className = 'sub' + (online ? ' ok' : ' err');
  t.textContent = online
    ? '기기 온라인'
    : '기기 오프라인' + (seen ? ' · 마지막 ' + seen.toLocaleTimeString() : '');
}

async function load() {
  const { data, error } = await sb.from('xiao_state').select('*').eq('device_id', DEVICE_ID).single();
  if (error) { renderConn('Supabase 오류: ' + error.message); return; }
  state = data; render();
}

async function setLed(on) {
  const { data, error } = await sb.from('xiao_state').update({ led_on: on })
    .eq('device_id', DEVICE_ID).select().single();
  if (error) { renderConn('LED 변경 실패: ' + error.message); return; }
  state = data; render();
}

sb.channel('xiao_state')
  .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'xiao_state', filter: 'device_id=eq.' + DEVICE_ID },
      payload => { state = payload.new; render(); })
  .subscribe(status => { if (status === 'SUBSCRIBED') load(); });

setInterval(() => renderConn(), 1000);
load();
</script>
</body>
</html>
